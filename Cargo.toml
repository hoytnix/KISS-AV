[package]
name = "kiss-daemon"
version = "2.0.0"
edition = "2021"
description = "Keep It Simple Stupid Antivirus"
authors = ["Michael Scott Hoyt (tehwiz.com)"]

[lib]
name = "kiss_daemon"
path = "src/lib.rs"

[[bin]]
name = "kiss-daemon"
path = "src/main.rs"

[dependencies]
# Shared dependencies
cfg-if = "1.0"
goldberg = "*"
libc = "0.2"

# Target-specific dependencies
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "KissDaemon"
identifier = "kissav.tehwiz.com"
formats = ["deb", "nsis", "dmg"]

[[package.metadata.packager.binaries]]
path = "kiss-daemon"
main = true
