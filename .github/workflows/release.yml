name: Release KISS AV

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-packager
        run: cargo binstall cargo-packager --no-confirm

      - name: Compile the Rust binary
        run: cargo build --release

      # ---------------------------------------------------
      # EXPLICIT OS-SPECIFIC PACKAGING COMMANDS
      # ---------------------------------------------------
      - name: Package for Linux
        if: matrix.os == 'ubuntu-latest'
        run: cargo packager --release -f deb

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        run: cargo packager --release -f nsis

      - name: Package for macOS
        if: matrix.os == 'macos-latest'
        run: cargo packager --release -f dmg
      # ---------------------------------------------------

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/*.deb
            target/release/*.exe
            target/release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}